<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Conversación privada · Español con Natali</title>
<style>
  @font-face{font-family:Onest;src:url('<!--ONEST-REGULAR-->') format('woff');font-weight:400;font-display:swap}
  @font-face{font-family:Onest;src:url('<!--ONEST-SEMIBOLD-->') format('woff');font-weight:600;font-display:swap}
  :root{color-scheme:light;--ink:#27362f;--muted:#525c52;--line:rgba(59,54,41,.16);--accent:#215a50;--accent-hover:#194a42;--soft:#dae9dd;--paper:#fffaf2;--cala:url('<!--MALLORCA-->');--pinar:url('<!--PINAR-->')}
  *{box-sizing:border-box}
  body{margin:0;background:#f3eee5;color:var(--ink);font:16px/1.45 Onest,system-ui,sans-serif;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
  [hidden]{display:none!important}button,summary{font:inherit;cursor:pointer}button:disabled{opacity:.58;cursor:default}
  button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  body[data-theme=pinar]{--landscape:var(--pinar);--accent:#4d5a36;--accent-hover:#3a4727;--soft:#e4e9cf}
  body[data-theme=arena]{--landscape:linear-gradient(145deg,#f9edda,#ba866d);--accent:#874a36;--accent-hover:#6d3526;--soft:#f2decd}
  header{width:min(calc(100% - 48px),1120px);margin:auto;min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.025em}.brand img{width:28px;height:32px;object-fit:contain;mix-blend-mode:multiply}
  .languages{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:24px;background:#fffaf3}
  .languages button{width:44px;height:38px;border:0;border-radius:22px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
  .languages [aria-pressed=true]{background:var(--soft);color:var(--ink)}
  main{width:min(calc(100% - 48px),1120px);margin:0 auto 24px;min-height:0;display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);border-radius:26px;overflow:hidden;background:#fffdf8;border:1px solid var(--line);box-shadow:0 16px 48px #583b2111}
  .scenery{background:var(--landscape,var(--cala)) center/cover;min-height:0}
  .workspace{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,4vw,62px);position:relative;gap:12px}
  h1,h2,p,blockquote{margin:0}h1{font-size:clamp(29px,4.2vw,48px);line-height:1.08;letter-spacing:-.048em;font-weight:600;overflow-wrap:anywhere}
  .title{display:grid;gap:10px}.person{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px}.person img{width:34px;height:34px;border-radius:100%;object-fit:cover}
  .lesson-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 13px}.lesson{padding:9px 12px;border:1px solid var(--line);border-radius:12px;display:grid;gap:1px;min-width:0}.lesson[data-current=true]{background:var(--soft);border-color:transparent}
  .lesson strong{font-weight:600;font-size:14px}.lesson span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.allowance{color:var(--muted)}
  .voice{display:grid;gap:8px}.action{width:100%;display:flex;min-height:52px;align-items:center;justify-content:center;gap:10px;padding:10px 14px;border:0;border-radius:13px;background:var(--accent);color:white;font-weight:600}
  .action:hover{background:var(--accent-hover)}.action svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
  .status,.save-note,.caption{font-size:14px;color:var(--muted);overflow-wrap:anywhere}.status{font-weight:600}.caption{line-height:1.4;max-height:3em;overflow:hidden}.status:empty,.save-note:empty,.caption:empty{display:none}
  .quiet-button{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--ink)}
  aside{margin-top:10px}.recap{display:none}h2{font-size:16px}
  .history-toggle{min-height:44px;display:flex;align-items:center;justify-content:space-between;list-style:none;color:var(--ink);border-top:1px solid var(--line);font-size:14px}.history-toggle::after{content:'›';font-size:21px}.history-toggle::-webkit-details-marker{display:none}
  .history-list{position:absolute;z-index:2;inset:12px;padding:52px 18px 18px;overflow:auto;background:#fffdf8;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 35px #452c202f;display:grid;align-content:start;gap:14px}
  details[open] .history-toggle{position:absolute;z-index:3;top:17px;left:30px;right:30px;background:#fffdf8;border:0}
  details[open] .history-toggle::after{content:'×'}
  .history-entry{display:grid;gap:8px}.history-line{font-size:14px;overflow-wrap:anywhere}.history-who,.history-date{display:block;font-size:12px;color:var(--muted)}
  footer{margin-top:8px;border-top:1px solid var(--line);padding-top:7px}.theme-picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.theme-title{font-size:12px;color:var(--muted)}
  .scene{min-height:44px;background:transparent;border:1px solid transparent;border-radius:10px;display:flex;align-items:center;gap:5px;padding:4px 6px;color:var(--ink);font-size:12px;white-space:nowrap}.scene[aria-pressed=true]{background:var(--soft);font-weight:600}
  .swatch{width:20px;height:20px;border-radius:6px;background:var(--scenery) center/cover;border:1px solid #382f2430}.swatch[data-image=mallorca]{--scenery:var(--cala)}.swatch[data-image=pinar]{--scenery:var(--pinar)}.swatch[data-image=arena]{--scenery:linear-gradient(135deg,#fff0d9,#c78c6f)}
  @media(max-width:680px){header{width:calc(100% - 26px);min-height:54px}.brand{font-size:14px}main{width:calc(100% - 20px);margin-bottom:10px;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;border-radius:19px}.workspace{padding:14px 16px;gap:7px}.scenery{background-position:center 48%}.theme-title{display:none}.theme-picker{gap:3px}.scene{font-size:11px}.lesson-list{margin-bottom:8px}aside{margin-top:5px}footer{margin-top:4px}.title{gap:6px}}
  @media(max-height:650px){header{min-height:50px}.workspace{padding-top:10px;padding-bottom:10px;gap:6px}.lesson-list{margin:4px 0 8px}.lesson{padding:5px 9px}.action{min-height:46px}.caption{max-height:1.45em}.person img{width:28px;height:28px}.history-toggle{min-height:38px}footer{padding-top:3px}}
  @media(max-height:520px){main{grid-template-rows:0 minmax(0,1fr)}.workspace{justify-content:start}.caption{display:none}}
  @media(prefers-reduced-motion:reduce){*,*::after{transition:none!important}}
</style>
</head>
<body data-theme="mallorca">
<header><div class="brand"><img src="<!--LYNX-->" alt="">Español con Natali</div><div class="languages"><button data-lang="ru" aria-pressed="true">RU</button><button data-lang="es" aria-pressed="false">ES</button></div></header>
<main>
 <div class="scenery" aria-hidden="true"></div>
 <div class="workspace">
  <div class="title"><div class="person"><img src="<!--AVATAR-->" alt="">Natali</div><h1 id="greeting" tabindex="-1">Ваша практика</h1></div>
  <p class="status" id="entrance" role="status">Открываем практику…</p>
  <div id="dashboard" hidden>
    <div id="allowance" class="lesson-list">
      <div class="lesson" id="lesson-1"><strong id="lesson-label-1"></strong><span id="lesson-time-1"></span></div>
      <div class="lesson" id="lesson-2"><strong id="lesson-label-2"></strong><span id="lesson-time-2"></span></div>
    </div>
    <section class="voice" aria-label="Natali">
      <button class="action" id="start"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg><span id="start-label">Начать практику</span></button>
      <button class="action" id="end" hidden>Пауза</button>
      <p class="status" id="voice-status" role="status"></p>
      <p class="caption" id="caption" aria-live="polite"></p>
      <button class="quiet-button" id="refresh" hidden>Обновить</button>
      <p class="save-note" id="save-note"></p>
    </section>
    <aside id="previous" aria-labelledby="memory-title" hidden>
      <div class="recap">
        <h2 id="memory-title">Прошлая практика</h2>
        <p class="quiet" id="last-practice"></p>
        <blockquote class="phrase" id="phrase" hidden></blockquote>
      </div>
      <details id="history" hidden>
        <summary id="history-toggle" class="history-toggle">Посмотреть разговор</summary>
        <div id="history-list" class="history-list" tabindex="0" role="region" aria-labelledby="history-toggle"></div>
      </details>
    </aside>
  </div>
 <footer>
  <div class="theme-picker" role="group" aria-labelledby="theme-title">
    <span class="theme-title" id="theme-title">Пейзаж</span>
    <button class="scene" type="button" data-theme="mallorca" aria-pressed="true"><span class="swatch" data-image="mallorca" aria-hidden="true"></span><span>Майорка</span></button>
    <button class="scene" type="button" data-theme="pinar" aria-pressed="false"><span class="swatch" data-image="pinar" aria-hidden="true"></span><span>Сосновый лес</span></button>
    <button class="scene" type="button" data-theme="arena" aria-pressed="false"><span class="swatch" data-image="arena" aria-hidden="true"></span><span>Песок</span></button>
  </div>
</footer>
 </div>
</main>
<!--CLIENT-->
</body>
</html>
